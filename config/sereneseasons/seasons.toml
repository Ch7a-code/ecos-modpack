# ECOS: anio de 72 dias (6 dias por sub-estacion x 12). Valores verificados contra las claves del jar 9.1.0.3.
[time_settings]
	# Dias de Minecraft por sub-estacion (default 8).
	sub_season_duration = 6
	# Estacion inicial del mundo nuevo: 1 = inicio de la primavera (0 = al azar, 10-12 = invierno).
	starting_sub_season = 1
	# Las estaciones solo avanzan con el servidor/mundo cargado.
	progress_season_while_offline = false

[dimension_settings]
	# Estaciones SOLO en el Overworld.
	whitelisted_dimensions = ["minecraft:overworld"]